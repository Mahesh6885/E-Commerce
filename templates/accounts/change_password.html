{% extends 'base.html' %}
{% load static %}

{% block content %}

<section class="section-content padding-y bg">
    <div class="container">
        <div class="row">
            {% include 'includes/dashboard_sidebar.html' %}

            <main class="col-md-9">
                <article class="card shadow-sm border-0" style="max-width: 600px;">
                    <header class="card-header bg-white py-3">
                        <h5 class="font-weight-bold mb-0"><i class="fa fa-lock text-primary mr-2"></i> Change Password</h5>
                    </header>
                    <div class="card-body p-4">
                        <form action="{% url 'change_password' %}" method="POST">
                            {% csrf_token %}
                            <div class="form-group mb-3">
                                <label class="small font-weight-bold">Current Password</label>
                                <input type="password" name="current_password" class="form-control" placeholder="Enter current password" required>
                            </div>

                            <div class="form-group mb-3">
                                <label class="small font-weight-bold">New Password</label>
                                <input type="password" name="new_password" class="form-control" placeholder="Create new password (min. 6 characters)" required>
                            </div>

                            <div class="form-group mb-4">
                                <label class="small font-weight-bold">Confirm New Password</label>
                                <input type="password" name="confirm_password" class="form-control" placeholder="Repeat new password" required>
                            </div>

                            <button type="submit" class="btn btn-primary font-weight-bold px-4 py-2 shadow-sm">
                                Update Password
                            </button>
                        </form>
                    </div>
                </article>
            </main>
        </div>
    </div>
</section>

{% endblock %}
